# location
- LOC_MISTHALL:
    description:
      long: |-
          You are at one end of a vast hall stretching forward out of sight to
          the west.  There are openings to either side.  Nearby, a wide stone
          staircase leads downward.  The hall is filled with wisps of white mist
          swaying to and fro almost as if alive.  A cold wind blows up the
          staircase.  There is a passage at the top of a dome behind you.
      short: 'You''re in Hall of Mists.'
      maptag: !!null
    conditions: {DEEP: true}
    sound: WIND_WHISTLES
    travel: [
      {verbs: [LEFT, SOUTH], action: [goto, LOC_NUGGET]},  # left, south
      {verbs: [FORWA, HALL, WEST], action: [goto, LOC_EASTBANK]},  # forward, hall, west
      {verbs: [STAIR, DOWN, NORTH], action: [goto, LOC_KINGHALL]},  # stairs, down, north
      {verbs: [UPWAR, PIT, STEPS, DOME, PASSA, EAST],  # upward, pit, steps, dome, passage, east
                              cond: [carry, NUGGET], action: [goto, LOC_DOME]},
      {verbs: [UPWAR], action: [goto, LOC_PITTOP]},  # upward
      {verbs: [Y2], action: [goto, LOC_JUMBLE]},  # magic word
    ]

# objects that start here
- STEPS:
    words: ['steps']
    inventory: '*steps'
    locations: [LOC_PITTOP, LOC_MISTHALL]
    immovable: true
    states: [STEPS_DOWN, STEPS_UP]
    descriptions:
    - 'Rough stone steps lead down the pit.'
    - 'Rough stone steps lead up the dome.'

# where each exit leads (the destination's description in the game)
# LOC_NUGGET: This is a low room with a crude note on the wall. The note says, "You won't get it up the steps".
# LOC_EASTBANK: You are on the east bank of a fissure slicing clear across the hall. The mist is quite thick here, and the fissure is too wide to jump.
# LOC_KINGHALL: You are in the Hall of the Mountain King, with passages off in all directions.
# LOC_DOME: The dome is unclimbable.
# LOC_PITTOP: At your feet is a small pit breathing traces of white mist. An east passage ends here except for a small crack leading on.
# LOC_JUMBLE: You are in a jumble of rock, with cracks everywhere.
