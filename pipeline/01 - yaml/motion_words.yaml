# The game's travel words, as the 5-letter codes adventure.yaml uses in `travel: verbs`, with the plain word
# they stand for. The original parser read only 5 letters, so the YAML keeps the cut-off codes; its own names
# for them are mostly MOT_<n>. Written by hand from the `motions:` section; change a word here when Jev or the
# spec writer misreads one.
#
# words: code -> plain word, used in the Jev exit question ("…any place or thing called debris?").
# magic: magic words. They name no place in the room, so an exit reached only by them is never drawn:
#        check_spec.py decides it, Jev is not asked.

